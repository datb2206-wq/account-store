# Cấu hình TẠM chỉ có HTTP — dùng 1 lần để certbot lấy chứng chỉ đầu tiên
# (accszone.conf tham chiếu file chứng chỉ chưa tồn tại nên `nginx -t` sẽ báo lỗi).
# Sau khi có chứng chỉ: xóa file này khỏi sites-enabled và bật accszone.conf.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
