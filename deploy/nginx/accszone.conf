# =============================================================
#  Nginx reverse proxy -> Next.js (127.0.0.1:3000)
#  Cài đặt: deploy/README.md (mục Nginx + SSL)
#  Thay toàn bộ "example.com" bằng tên miền thật.
# =============================================================

# Giới hạn tần suất ở tầng Nginx (app còn có rate limit riêng bằng Redis)
limit_req_zone $binary_remote_addr zone=az_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=az_api:10m  rate=20r/s;
limit_req_status 429;

upstream accszone_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP -> HTTPS (certbot --nginx tự chèn location xác minh khi gia hạn) ----------
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

# ---------- www -> tên miền chính ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://example.com$request_uri;
}

# ---------- HTTPS chính ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;     # tạo bởi certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;
    client_max_body_size 10m;   # nhập kho bằng file txt lớn -> tăng nếu cần

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    access_log /var/log/nginx/accszone.access.log;
    error_log  /var/log/nginx/accszone.error.log warn;

    # Header chung gửi sang app.
    # QUAN TRỌNG: X-Forwarded-For bị GHI ĐÈ bằng IP thật (không nối thêm) — app lấy IP đầu
    # tiên trong header này để rate limit, nối thêm thì client giả mạo được IP.
    # Dùng Cloudflare phía trước: xem mục "Cloudflare" trong deploy/README.md.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    # File tĩnh có hash trong tên -> cache 1 năm
    location /_next/static/ {
        proxy_pass http://accszone_web;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Chống dò mật khẩu: đăng nhập / đăng ký
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=az_auth burst=5 nodelay;
        proxy_pass http://accszone_web;
    }

    # Webhook ngân hàng: không giới hạn chặt (Casso/SePay có thể gửi dồn)
    location /api/webhooks/ {
        proxy_pass http://accszone_web;
    }

    location /api/ {
        limit_req zone=az_api burst=40 nodelay;
        proxy_pass http://accszone_web;
    }

    # Health check chỉ cho máy chủ nội bộ / uptime monitor của bạn
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://accszone_web;
    }

    location / {
        proxy_pass http://accszone_web;
    }
}
