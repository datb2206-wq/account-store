# =============================================================
#  Toàn bộ hệ thống production: PostgreSQL + Redis + migrate + Web + Worker
#  Chạy từ thư mục gốc (đọc biến từ .env):
#    docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build
#  Hướng dẫn đầy đủ: deploy/README.md
# =============================================================
name: accszone-prod

x-app-env: &app-env
  NODE_ENV: production
  # Trong mạng Docker, DB/Redis gọi bằng tên service -> ghi đè URL localhost trong .env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=${DB_POOL_SIZE:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET chưa đặt}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET chưa đặt}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY chưa đặt}
  BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-}
  TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
  BSC_RPC_URL: ${BSC_RPC_URL:-}
  SUPPLIER_SYNC_MINUTES: ${SUPPLIER_SYNC_MINUTES:-10}
  BSC_SCAN_LOOKBACK_BLOCKS: ${BSC_SCAN_LOOKBACK_BLOCKS:-2000}
  BSC_LOGS_CHUNK: ${BSC_LOGS_CHUNK:-500}

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt}
      POSTGRES_DB: ${POSTGRES_DB}
    # Không publish port: chỉ web/worker trong mạng nội bộ truy cập được
    volumes:
      - pg_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: job BullMQ không mất khi restart. noeviction: BẮT BUỘC với BullMQ.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD chưa đặt}
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  # Chạy 1 lần mỗi lần deploy: áp dụng migration mới rồi thoát. web/worker chờ bước này xong.
  migrate:
    image: accszone-worker:${APP_VERSION:-latest}
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    working_dir: /app/packages/database
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging

  web:
    image: accszone-web:${APP_VERSION:-latest}
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    restart: unless-stopped
    environment: *app-env
    # Chỉ mở cho Nginx trên cùng máy. Không mở 0.0.0.0:3000 ra Internet.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    # Ảnh biên lai chuyển khoản khách tải lên (UPLOAD_DIR=/app/uploads trong image)
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    logging: *logging

  worker:
    image: accszone-worker:${APP_VERSION:-latest}
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    restart: unless-stopped
    environment: *app-env
    # Thời gian chờ job đang chạy (VD đặt hàng web gốc) hoàn tất trước khi bị kill
    stop_grace_period: 60s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    logging: *logging

volumes:
  pg_data:
  redis_data:
  uploads:
